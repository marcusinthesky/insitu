[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "insitu"
version = "0.2.0rc1"
description = "Native document materialization engine with a compatible Python extension SDK"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Insitu contributors" }]
dependencies = ["pydantic>=2.11,<3"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Rust", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/marcusinthesky/insitu"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[dependency-groups]
dev = [
  "mkdocstrings-python==2.0.9",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "zensical==0.0.64",
]

# The engine is a maturin binary; development installs only the SDK's
# dependencies and imports the SDK from python/ (see pytest pythonpath).
[tool.uv]
package = false

[tool.maturin]
manifest-path = "crates/insitu/Cargo.toml"
bindings = "bin"
python-source = "python"
python-packages = ["insitu"]
strip = true
include = ["LICENSE", "docs/**", "tests/fixtures/**", "rust-toolchain.toml"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]
