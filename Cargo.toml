[workspace]
members = ["crates/insitu", "crates/insitu-core", "crates/insitu-protocol", "crates/insitu-sdk"]
default-members = ["crates/insitu"]
resolver = "3"

[workspace.package]
version = "0.2.0-rc.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/marcusinthesky/insitu"
authors = ["Insitu contributors"]

[workspace.dependencies]
insitu-core = { path = "crates/insitu-core", version = "=0.2.0-rc.1" }
insitu-protocol = { path = "crates/insitu-protocol", version = "=0.2.0-rc.1" }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
schemars = { version = "0.8", features = ["preserve_order"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "signal"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
regex = "1.11"
ignore = "0.4"
globset = "0.4"
walkdir = "2.5"
minijinja = { version = "2.12", features = ["loader", "json", "builtins", "preserve_order"] }
minijinja-contrib = { version = "2.12", features = ["pycompat"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks", "extra_check"] }
serde_norway = "0.9"
yaml-edit = "0.3.2"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
tempfile = "3.21"
url = "2.5"
pep440_rs = "0.7"
notify = "8.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
