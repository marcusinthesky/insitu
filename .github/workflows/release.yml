# Publishes a pushed `v*` tag. Every registry uses trusted publishing (OIDC), so
# no tokens are stored; the `release` environment's reviewers approve each publish.
# Pull requests touching release inputs run the same pipeline as a dry run.
name: release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/artifacts.yml
      - packaging/**
      - scripts/**
      - Cargo.toml
      - crates/*/Cargo.toml
      - pyproject.toml
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: check
        run: |
          python scripts/check_versions.py ${{ github.ref_type == 'tag' && '--tag "$GITHUB_REF_NAME"' || '' }}
          echo "prerelease=${{ contains(github.ref_name, '-') }}" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/artifacts.yml
  sdist:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'maturin>=1.9,<2'
      - run: maturin sdist --out dist/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/
  crates-io:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishes in dependency order and waits for each crate to be indexed.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  pypi:
    needs: [build, sdist]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: insitu-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
  npm:
    needs: [version, build]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: insitu-*
          merge-multiple: true
          path: dist
      # Artifacts are zipped without mode bits; the wrapper spawns these directly.
      - run: chmod +x dist/npm/*/bin/insitu
      # Platform packages first, so the wrapper never resolves to a missing dependency.
      # The ./ prefix matters: npm reads a bare `owner/name` path as a GitHub repository.
      # npm 11 ignores publishConfig.tag, so pre-releases must name their dist-tag.
      - run: |
          for package in ./dist/npm/*/; do npm publish --tag "$TAG" "$package"; done
          npm publish --tag "$TAG" ./packaging/npm
        env:
          TAG: ${{ needs.version.outputs.prerelease == 'true' && 'next' || 'latest' }}
  dry-run:
    needs: [build, sdist]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: insitu-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: chmod +x dist/npm/*/bin/insitu
      - run: cargo publish --workspace --locked --dry-run
      - run: |
          python -m pip install twine
          twine check --strict dist/wheels/*
      - run: |
          for package in ./dist/npm/*/; do npm publish --dry-run --tag next "$package"; done
          npm publish --dry-run --tag next ./packaging/npm
  # Runs after every registry succeeds on a tag, and without publishing on a pull request.
  github:
    needs: [version, build, sdist, crates-io, pypi, npm]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: insitu-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Archive binaries
        working-directory: dist/bin
        run: |
          for binary in insitu-*; do
            case "$binary" in
              *.exe) zip -q "${binary%.exe}.zip" "$binary" ;;
              *) chmod +x "$binary"; tar -czf "$binary.tar.gz" "$binary" ;;
            esac
            rm "$binary"
          done
      - run: |
          mkdir release
          cp dist/bin/* dist/wheels/* release/
          (cd release && sha256sum -- * > SHA256SUMS)
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: release/
      - if: github.event_name == 'push'
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
