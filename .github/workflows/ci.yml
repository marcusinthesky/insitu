name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Every gate in .pre-commit-config.yaml, with the toolchain pinned by devenv.lock.
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: bash nix/install-devenv.sh
      - run: devenv test
      - run: devenv shell -- just conformance
  # The MSRV toolchain in rust-toolchain.toml, which rustup installs on first use.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pydantic>=2.11,<3'
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p insitu
      - shell: bash
        run: python scripts/conformance.py --binary target/debug/insitu${{ runner.os == 'Windows' && '.exe' || '' }}
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-update-lock-file
