default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      # Formatting
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

      # Syntax validation
      - id: check-yaml
      - id: check-toml
      - id: check-json

      # Security
      - id: detect-private-key
        stages: [pre-commit, pre-push]
      - id: check-added-large-files
        stages: [pre-commit, pre-push]

      # Cross-platform compatibility
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: destroyed-symlinks

      # Quality
      - id: check-merge-conflict
      - id: check-vcs-permalinks

  - repo: local
    hooks:
      # ── Nix ────────────────────────────────────────────────────────────
      - id: nixfmt
        name: nixfmt (RFC 166 format)
        entry: nixfmt --check
        language: system
        files: \.nix$
      - id: statix
        name: statix (Nix anti-patterns)
        entry: statix check --format errfmt
        language: system
        files: \.nix$
        pass_filenames: false
      - id: deadnix
        name: deadnix (unused Nix bindings)
        entry: deadnix --fail
        language: system
        files: \.nix$

      # ── Config ─────────────────────────────────────────────────────────
      - id: tombi-format
        name: tombi (TOML format)
        entry: tombi format --offline --check
        language: system
        types_or: [toml]
        # Generated by cargo and uv; their writers own the format.
        exclude: (^|/)(Cargo|uv)\.lock$
      - id: tombi-lint
        name: tombi (TOML lint)
        entry: tombi lint --offline
        language: system
        types_or: [toml]
        # Generated by cargo and uv; their writers own the format.
        exclude: (^|/)(Cargo|uv)\.lock$
      - id: prek-validate-config
        name: prek (config parses)
        entry: prek validate-config
        language: system
        files: (^|/)\.pre-commit-config\.yaml$

      # ── Prose ──────────────────────────────────────────────────────────
      - id: rumdl-fmt
        name: rumdl (Markdown format)
        entry: rumdl fmt --check
        language: system
        files: \.md$
      - id: rumdl
        name: rumdl (Markdown lint)
        entry: rumdl check
        language: system
        files: \.md$
      - id: schematter
        name: schematter (one title heading per guide)
        entry: schematter validate --schema schemas/guide.document-schema.yaml
        language: system
        files: \.md$
      - id: codespell
        name: codespell
        entry: codespell
        language: system
      # Network gate, so pre-push only: rumdl owns anchors and relative paths;
      # this makes only the orthogonal claim that external links respond.
      - id: lychee
        name: lychee (external link integrity)
        entry: lychee --config lychee.toml .
        language: system
        types: [markdown]
        pass_filenames: false
        stages: [pre-push]

      # ── Task runner ────────────────────────────────────────────────────
      - id: just-fmt
        name: just (format justfiles)
        entry: >-
          bash -euc 'rc=0; for f; do just --justfile "$f" --fmt --check --unstable || rc=1; done; exit $rc' --
        language: system
        files: (^|/)justfile$

      # ── Commit messages ────────────────────────────────────────────────
      - id: convco
        name: convco (conventional commits)
        entry: bash -euc 'exec convco check --from-stdin < "$1"' --
        language: system
        stages: [commit-msg]

      # ── Rust ───────────────────────────────────────────────────────────
      - id: cargo-fmt
        name: rustfmt
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false
      - id: clippy
        name: Clippy (warnings denied)
        entry: just lint
        language: system
        files: \.rs$|(^|/)Cargo\.(toml|lock)$
        pass_filenames: false
      - id: rust-test
        name: Rust tests (nextest + doctests)
        entry: just test
        language: system
        files: \.rs$|(^|/)Cargo\.(toml|lock)$|^tests/fixtures/
        pass_filenames: false
      - id: rustdoc
        name: rustdoc (warnings denied)
        entry: just docs
        language: system
        files: \.rs$|(^|/)Cargo\.(toml|lock)$
        pass_filenames: false
      - id: cargo-machete
        name: cargo-machete (unused dependencies)
        entry: cargo machete
        language: system
        files: (^|/)Cargo\.toml$
        pass_filenames: false
      # Fetches the advisory database, so it runs when dependencies change.
      - id: cargo-deny
        name: cargo-deny (advisories, licenses, sources)
        entry: cargo deny check
        language: system
        files: (^|/)Cargo\.(toml|lock)$|^deny\.toml$
        pass_filenames: false

      # The README's documentation index is an Insitu view of this repository.
      - id: insitu-check
        name: insitu check (views current)
        entry: cargo run --quiet --locked -p insitu -- check
        language: system
        files: \.md$|^insitu(/|\.toml$)|\.rs$|(^|/)Cargo\.(toml|lock)$
        pass_filenames: false

      # ── Python SDK ─────────────────────────────────────────────────────
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: pytest
        name: Python SDK and packaging tests
        entry: uv run --frozen pytest -q
        language: system
        files: \.py$|^pyproject\.toml$|^uv\.lock$|^packaging/
        pass_filenames: false

      # ── npm launcher ───────────────────────────────────────────────────
      - id: node-test
        name: npm launcher tests
        entry: node --test tests/node/launcher.test.cjs
        language: system
        files: ^packaging/npm/|^tests/node/
        pass_filenames: false
