site_name: Insitu
site_url: https://marcusinthesky.github.io/insitu/
site_description: Reactive materializations for repository documents
docs_dir: docs
site_dir: site
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Python API: reference.md
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            merge_init_into_class: true
            show_source: false
validation:
  invalid_links: true
  invalid_link_anchors: true
